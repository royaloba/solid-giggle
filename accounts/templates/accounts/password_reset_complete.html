{% extends 'base.html' %}
{% block content %}
<div class="container mx-auto px-4 py-20 max-w-md text-center">
    <div class="bg-white p-8 rounded-2xl shadow-xl border border-gray-100 border-t-4 border-t-wine">
        <div class="w-12 h-12 bg-green-50 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        </div>
        <h1 class="text-2xl font-extrabold text-gray-900 mb-2">Password Reset Complete</h1>
        <p class="text-sm text-gray-500 mb-6">Your password has been reset successfully. You may now log in with your new credentials.</p>
        <a href="{% url 'accounts:login' %}" class="inline-block w-full py-3 bg-wine text-white font-bold rounded-xl hover:bg-[#5a252b] transition-all">
            Sign In Now
        </a>
    </div>
</div>
{% endblock %}
