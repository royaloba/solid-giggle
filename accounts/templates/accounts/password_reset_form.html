{% extends 'base.html' %}
{% block content %}
<div class="container mx-auto px-4 py-20 max-w-md">
    <div class="bg-white p-8 rounded-2xl shadow-xl border border-gray-100 border-t-4 border-t-wine">
        <h1 class="text-2xl font-extrabold text-gray-900 mb-2 text-center tracking-tight">Reset Password</h1>
        <p class="text-xs text-gray-500 text-center mb-6">Enter your email address and we'll send you a link to reset your password.</p>
        
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Email Address</label>
                {{ form.email }}
                <span class="text-xs text-red-500">{{ form.email.errors }}</span>
            </div>
            
            <button type="submit" class="w-full py-4 bg-wine text-white font-bold rounded-xl hover:bg-[#5a252b] transition-all shadow-md hover:shadow-lg mt-4 text-base">
                Send Reset Link
            </button>
        </form>
        
        <p class="text-center text-sm text-gray-500 mt-6">
            Remembered your password? <a href="{% url 'accounts:login' %}" class="text-wine font-bold hover:underline">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
