{% extends 'base.html' %}
{% block content %}
<div class="container mx-auto px-4 py-20 max-w-md">
    <div class="bg-white p-8 rounded-2xl shadow-xl border border-gray-100 border-t-4 border-t-wine">
        <h1 class="text-3xl font-extrabold text-gray-900 mb-6 text-center tracking-tight">Welcome Back</h1>
        
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            {{ form.non_field_errors }}
            
            {% for field in form %}
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">{{ field.label }}</label>
                    {{ field }}
                    <span class="text-xs text-red-500">{{ field.errors }}</span>
                </div>
            {% endfor %}
            
            <button type="submit" class="w-full py-4 bg-wine text-white font-bold rounded-xl hover:bg-[#5a252b] transition-all shadow-md hover:shadow-lg mt-6 text-lg">
                Sign In
            </button>
        </form>
        
        <p class="text-center text-sm text-gray-500 mt-6">
            Don't have an account? <a href="{% url 'accounts:register' %}" class="text-wine font-bold hover:text-[#5a252b] hover:underline transition-colors">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
