{% extends 'base.html' %}
{% block content %}
<div class="container mx-auto px-4 py-20 max-w-md text-center">
    <div class="bg-white p-8 rounded-2xl shadow-xl border border-gray-100 border-t-4 border-t-wine">
        <div class="w-12 h-12 bg-wine/10 text-wine rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
        </div>
        <h1 class="text-2xl font-extrabold text-gray-900 mb-2">Check Your Email</h1>
        <p class="text-sm text-gray-500 mb-6">If an account exists with the email you entered, we've sent instructions to reset your password. Please check your inbox and spam folder.</p>
        <a href="{% url 'accounts:login' %}" class="inline-block w-full py-3 bg-wine text-white font-bold rounded-xl hover:bg-[#5a252b] transition-all">
            Return to Login
        </a>
    </div>
</div>
{% endblock %}
