{% extends 'base.html' %}

{% block content %}
<div class="container mx-auto px-4 py-20 max-w-2xl text-center">
    <div class="bg-white p-10 rounded-2xl shadow-xl border border-gray-100">
        <div class="w-24 h-24 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-red-600" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </div>

        <h1 class="text-4xl font-extrabold text-gray-900 mb-2">Payment Failed</h1>
        <p class="text-gray-500 mb-8 text-lg">
            {% if message %}
            {{ message }}
            {% else %}
            Unfortunately, your transaction could not be completed. You have not been charged.
            {% endif %}
        </p>

        <a href="{% url 'store:home' %}"
            class="inline-block px-8 py-4 bg-black text-white font-bold rounded-lg hover:bg-gray-800 transition">
            Return to Store & Try Again
        </a>
    </div>
</div>
{% endblock %}
