{% extends 'base.html' %}

{% block content %}
<div class="container mx-auto px-4 py-20 max-w-2xl text-center">
    <div class="bg-white p-10 rounded-2xl shadow-xl border border-gray-100">
        <!-- Branded Success Icon -->
        <div class="w-24 h-24 bg-wine/10 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-wine" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
        </div>
        
        <h1 class="text-4xl font-extrabold text-gray-900 mb-2 tracking-tight">Payment Successful!</h1>
        <p class="text-gray-500 mb-8 text-lg">Thank you for shopping with Stylinsole. Your order is being processed.</p>
        
        <!-- Highlighted Order Reference -->
        <div class="bg-gray-50 p-6 rounded-xl mb-8 text-left border-l-4 border-wine shadow-sm">
            <p class="text-sm text-gray-500 font-bold uppercase mb-1 tracking-wider">Order Reference</p>
            <p class="text-2xl font-black text-wine">{{ order.reference }}</p>
        </div>

        <!-- Call to Action Buttons -->
        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <a href="{% url 'orders:receipt' order.reference %}" class="px-8 py-4 bg-wine text-white font-bold rounded-xl hover:bg-[#5a252b] transition-all shadow-md hover:shadow-lg">
                View Receipt
            </a>
            <a href="{% url 'store:home' %}" class="px-8 py-4 bg-white text-wine border-2 border-wine font-bold rounded-xl hover:bg-wine/5 transition-all">
                Continue Shopping
            </a>
        </div>
    </div>
</div>
{% endblock %}
