{% extends 'dashboard/base.html' %}

{% block content %}
<div class="p-8 overflow-y-auto h-full">
    <div class="max-w-2xl mx-auto">
        <h2 class="text-3xl font-black text-gray-900 mb-6">{{ title }}</h2>
        
        <form method="POST" class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
            {% csrf_token %}
            
            <div class="space-y-6 mb-8">
                {% for field in form %}
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">{{ field.label }}</label>
                        {{ field }}
                        <span class="text-xs text-red-500">{{ field.errors }}</span>
                        {% if field.name == 'slug' %}
                            <p class="text-xs text-gray-400 mt-1">Use lowercase letters and hyphens only (e.g., running-shoes).</p>
                        {% endif %}
                    </div>
                {% endfor %}
            </div>

            <button type="submit" class="w-full py-4 bg-wine text-white font-bold text-lg rounded-xl shadow-md hover:bg-[#5a252b] transition-all">
                Save {{ title|slice:"8:" }}
            </button>
        </form>
    </div>
</div>

<style>
    input {
        width: 100%;
        padding: 0.75rem 1rem;
        border-radius: 0.5rem;
        border: 1px solid #e5e7eb;
        background-color: #f9fafb;
    }
    input:focus {
        outline: none;
        border-color: #722F37;
        box-shadow: 0 0 0 3px rgba(114, 47, 55, 0.1);
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Django form fields automatically get an 'id_<fieldname>' ID
        const nameInput = document.getElementById('id_name');
        const slugInput = document.getElementById('id_slug');

        if (nameInput && slugInput) {
            nameInput.addEventListener('input', function() {
                // Convert to lowercase, replace spaces/special chars with hyphens
                let slug = this.value.toLowerCase().trim()
                    .replace(/[^a-z0-9\s-]/g, '') // Remove invalid chars
                    .replace(/[\s-]+/g, '-');     // Replace spaces/dashes with a single dash
                
                slugInput.value = slug;
            });
        }
    });
</script>

{% endblock %}
