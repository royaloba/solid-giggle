{% extends 'dashboard/base.html' %}

{% block content %}
<div class="p-8 overflow-y-auto h-full">
    <div class="max-w-3xl mx-auto">
        <h2 class="text-3xl font-black text-gray-900 mb-6">Add New Sneaker</h2>
        
        <form method="POST" enctype="multipart/form-data" class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
            {% csrf_token %}
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <!-- Loop through the form fields and style them nicely -->
                {% for field in form %}
                    <!-- NEW: Added available_sizes to span both columns -->
                    <div class="{% if field.name == 'description' or field.name == 'image' or field.name == 'available_sizes' %}md:col-span-2{% endif %}">
                        <label class="block text-sm font-bold text-gray-700 mb-1">
                            {{ field.label }} 
                            {% if field.field.required %}<span class="text-red-500">*</span>{% endif %}
                        </label>
                        
                        <!-- NEW: Render the help text for the size instructions -->
                        {% if field.help_text %}
                            <p class="text-xs text-gray-500 mb-2">{{ field.help_text }}</p>
                        {% endif %}
                        
                        {{ field }}
                        <span class="text-xs text-red-500">{{ field.errors }}</span>
                    </div>
                {% endfor %}
            </div>

            <button type="submit" class="w-full py-4 bg-wine text-white font-bold text-lg rounded-xl shadow-md hover:bg-[#5a252b] transition-all">
                Save Product & Upload Image
            </button>
        </form>
    </div>
</div>

<!-- Tailwind Styles specifically for the auto-generated Django form inputs -->
<style>
    /* NEW: Specify input types so checkboxes don't stretch to 100% width */
    input[type="text"], input[type="number"], input[type="file"], select, textarea {
        width: 100%;
        padding: 0.75rem 1rem;
        border-radius: 0.5rem;
        border: 1px solid #e5e7eb;
        background-color: #f9fafb;
    }
    input[type="text"]:focus, input[type="number"]:focus, select:focus, textarea:focus {
        outline: none;
        border-color: #722F37;
        box-shadow: 0 0 0 3px rgba(114, 47, 55, 0.1);
    }
    input[type="checkbox"] {
        width: auto;
        margin-right: 0.5rem;
        accent-color: #722F37;
    }
</style>
{% endblock %}
