<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Management | Stylinsole</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { wine: '#722F37', } } }
        }
    </script>
</head>
<body class="bg-[#F8FAFC] font-sans flex h-screen overflow-hidden text-gray-800">

   <!-- The Redesigned Analytics Sidebar -->
<aside class="w-64 bg-[#1a1c23] text-gray-400 flex flex-col h-full shrink-0 shadow-xl z-20">
    <!-- Logo -->
    <div class="p-6 flex items-center gap-3 border-b border-gray-800 text-white">
        <svg class="w-8 h-8 text-wine" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
        <h1 class="text-xl font-black tracking-widest uppercase">STYLINSOLE</h1>
    </div>
    
    <!-- Navigation -->
    <nav class="flex-1 px-4 py-6 space-y-1 overflow-y-auto font-medium text-sm">
        
        <a href="{% url 'store:dashboard' %}" class="flex items-center gap-3 px-4 py-3 rounded-xl {% if request.resolver_match.url_name == 'dashboard' %}bg-wine text-white shadow-lg{% else %}hover:bg-gray-800 hover:text-white transition-colors{% endif %}">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            Dashboard
        </a>

        <div class="mt-6 mb-2 px-4 text-[10px] font-bold text-gray-500 uppercase tracking-wider">Inventory Management</div>
        
        <!-- Products with inline Quick Action -->
        <div class="flex items-center justify-between group rounded-xl transition-colors {% if request.resolver_match.url_name == 'dashboard_products' %}bg-wine{% else %}hover:bg-gray-800{% endif %}">
            <a href="{% url 'store:dashboard_products' %}" class="flex items-center gap-3 px-4 py-3 flex-1 {% if request.resolver_match.url_name == 'dashboard_products' %}text-white{% else %}text-gray-400 group-hover:text-white{% endif %}">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                Products
            </a>
            <a href="{% url 'store:dashboard_add_product' %}" class="mr-2 p-1.5 rounded-lg transition-colors {% if request.resolver_match.url_name == 'dashboard_products' %}text-white bg-white/20 hover:bg-white/30{% else %}bg-gray-800/50 text-gray-400 hover:text-white hover:bg-wine{% endif %}" title="Add Product">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            </a>
        </div>

        <!-- Brands with inline Quick Action -->
        <div class="flex items-center justify-between group hover:bg-gray-800 rounded-xl transition-colors">
            <a href="#" class="flex items-center gap-3 px-4 py-3 flex-1 group-hover:text-white">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path></svg>
                Brands
            </a>
            <a href="{% url 'store:dashboard_add_brand' %}" class="mr-2 p-1.5 bg-gray-800/50 text-gray-400 hover:text-white hover:bg-wine rounded-lg transition-colors" title="Add Brand">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            </a>
        </div>

        <!-- Categories with inline Quick Action -->
        <div class="flex items-center justify-between group hover:bg-gray-800 rounded-xl transition-colors">
            <a href="#" class="flex items-center gap-3 px-4 py-3 flex-1 group-hover:text-white">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                Categories
            </a>
            <a href="{% url 'store:dashboard_add_category' %}" class="mr-2 p-1.5 bg-gray-800/50 text-gray-400 hover:text-white hover:bg-wine rounded-lg transition-colors" title="Add Category">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            </a>
        </div>

        <div class="mt-6 mb-2 px-4 text-[10px] font-bold text-gray-500 uppercase tracking-wider">Sales & Fulfillment</div>
        
        
        <!-- Orders -->
        <a href="{% url 'store:dashboard_orders' %}" class="flex items-center justify-between px-4 py-3 rounded-xl transition-colors {% if request.resolver_match.url_name == 'dashboard_orders' or request.resolver_match.url_name == 'dashboard_order_detail' %}bg-wine text-white shadow-lg{% else %}text-gray-400 hover:bg-gray-800 hover:text-white{% endif %}">
            <span class="flex items-center gap-3">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                Orders
            </span>
        </a>
    </nav>
    
    <div class="p-4 border-t border-gray-800">
        <a href="{% url 'store:home' %}" class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:text-white rounded-xl font-bold transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            Storefront
        </a>
    </div>
</aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-full overflow-hidden">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
